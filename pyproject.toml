[project]
name = "jaal-premortem"
version = "0.1.0"
description = "Jaal Pre-Mortem: Graph-Native Incident Decision Assistant for Crisis Commanders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "falkordb==1.7.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
