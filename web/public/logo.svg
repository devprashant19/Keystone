<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="KEYSTONE">
  <title>KEYSTONE</title>
  <rect width="256" height="256" fill="#f5f2eb"/>
  <rect x="8" y="8" width="240" height="240" fill="none" stroke="#000000" stroke-width="12"/>
  <!-- The keystone: the wedge at the apex of an arch, which fails the whole span if removed. -->
  <path d="M56 56 H200 L164 200 H92 Z" fill="#000000"/>
  <!-- The dependency chain the product traverses: road -> feeder -> tower. -->
  <line x1="128" y1="92" x2="128" y2="168" stroke="#0369a1" stroke-width="8"/>
  <circle cx="128" cy="92" r="14" fill="#0369a1"/>
  <circle cx="128" cy="130" r="14" fill="#f5f2eb"/>
  <circle cx="128" cy="130" r="14" fill="none" stroke="#0369a1" stroke-width="8"/>
  <circle cx="128" cy="168" r="14" fill="#0369a1"/>
</svg>
