<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>KEYSTONE | Incident Command Deck</title>
    <meta name="description" content="Graph-native disaster-response pre-mortem decision agent. Evaluates every second-failure contingency across road, power and telecom layers on isolated FalkorDB branches, and abstains when no action is defensible." />
    <meta name="author" content="Prashant Bahuguna" />
    <meta name="application-name" content="KEYSTONE Pre-Mortem" />

    <!-- Icons. Hand-authored geometry in public/logo.svg; PNGs are a deterministic
         render of it via scripts/make-icons.mjs. No generated or stock artwork. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Light is the default; both are declared so the browser chrome matches the deck. -->
    <meta name="theme-color" content="#f2f8fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06111f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph. og:image is a real screenshot of the running deck. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KEYSTONE Pre-Mortem" />
    <meta property="og:title" content="KEYSTONE | Find what breaks before it breaks you." />
    <meta property="og:description" content="A graph-native pre-mortem agent for urban infrastructure. 14 Delhi arterial corridors, 182 ordered failure pairs, evaluated on isolated FalkorDB branches with every number traceable to the graph." />
    <meta property="og:image" content="/og-cover.png" />
    <meta property="og:image:alt" content="The KEYSTONE Incident Command Deck showing a blast radius across road, power and telecom layers." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KEYSTONE | Find what breaks before it breaks you." />
    <meta name="twitter:description" content="Graph-native disaster-response pre-mortem agent built on FalkorDB. Multi-hop cross-layer reasoning, explainable results, and first-class abstention." />
    <meta name="twitter:image" content="/og-cover.png" />

    <!-- Fonts: Plus Jakarta Sans, Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
